# =============================================================================
# Publish — Build & Push Docker images to GitHub Container Registry (GHCR)
#
# Triggered on push to main (after CI passes).
#
# Versioning strategy:
#   ghcr.io/<owner>/<app>:latest        → always points to most recent build
#   ghcr.io/<owner>/<app>:main-<sha>    → immutable, traceable by commit SHA
#   ghcr.io/<owner>/<app>:<tag>         → semantic version (on git tag push)
#
# To deploy a specific version:
#   docker pull ghcr.io/<owner>/api-gateway:v1.2.3
#
# To rollback:
#   docker pull ghcr.io/<owner>/api-gateway:main-abc1234
# =============================================================================
name: Publish

on:
  push:
    branches: [main]
    tags:
      - 'v*'   # e.g. v1.0.0, v1.2.3

# Required permissions to push to GHCR
permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  # github.repository = "danielsantosbr255/demo-rabbitmq" → owner is lowercase
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  # ---------------------------------------------------------------------------
  # Build and push each service image in parallel
  # ---------------------------------------------------------------------------
  publish:
    name: Publish (${{ matrix.app }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - app: api-gateway
            context: apps/api-gateway
          - app: email-worker
            context: apps/email-worker
          - app: sms-worker
            context: apps/sms-worker
          - app: dlq-inspector
            context: apps/dlq-inspector
          - app: dashboard
            context: apps/dashboard

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # Login to GHCR using the automatic GITHUB_TOKEN (no secret needed)
      # -----------------------------------------------------------------------
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # -----------------------------------------------------------------------
      # Generate image tags:
      #   - latest                    → on push to main
      #   - main-<short-sha>          → on push to main (immutable)
      #   - v1.2.3 + 1.2.3 + latest  → on git tag push
      # -----------------------------------------------------------------------
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_PREFIX }}/${{ matrix.app }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=main-,format=short,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}

      # -----------------------------------------------------------------------
      # Enable BuildKit multi-platform cache (speeds up repeated builds)
      # -----------------------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # -----------------------------------------------------------------------
      # Build targeting the 'prod' stage and push to GHCR
      # -----------------------------------------------------------------------
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cache layers between runs to speed up builds
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}

services:
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >
        -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - notification-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - notification-net

  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
      target: prod
    image: api-gateway:prod
    pull_policy: build
    container_name: api-gateway
    ports:
      - '3000:3000'
    env_file: apps/api-gateway/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - notification-net
    restart: unless-stopped

  email-worker:
    build:
      context: ./apps/email-worker
      dockerfile: Dockerfile
    image: email-worker
    pull_policy: build
    container_name: email-worker
    env_file: apps/email-worker/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-net
    restart: unless-stopped

  sms-worker:
    build:
      context: ./apps/sms-worker
      dockerfile: Dockerfile
    image: sms-worker
    pull_policy: build
    container_name: sms-worker
    env_file: apps/sms-worker/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-net
    restart: unless-stopped

  dlq-inspector:
    build:
      context: ./apps/dlq-inspector
      dockerfile: Dockerfile
    image: dlq-inspector
    pull_policy: build
    container_name: dlq-inspector
    env_file: apps/dlq-inspector/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-net
    restart: unless-stopped

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
    image: dashboard
    pull_policy: build
    container_name: dashboard
    ports:
      - '5173:5173'
    environment:
      GATEWAY_API_URL: http://api-gateway:3000
      RABBITMQ_API_URL: http://rabbitmq:15672
    depends_on:
      rabbitmq:
        condition: service_healthy
      api-gateway:
        condition: service_started
    networks:
      - notification-net
    restart: unless-stopped

networks:
  notification-net:
    driver: bridge

volumes:
  rabbitmq_data:

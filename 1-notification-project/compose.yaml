services:

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: >
        -rabbitmq_management load_definitions "/etc/rabbitmq/definitions.json"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - ./rabbitmq/definitions.json:/etc/rabbitmq/definitions.json:ro
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - notification-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - notification-net

  api-gateway:
    build:
      context: .
      dockerfile: apps/api-gateway/Dockerfile
    container_name: api-gateway
    ports:
      - '3000:3000'
    env_file: apps/api-gateway/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3000/health']
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - notification-net
    restart: unless-stopped

  email-worker:
    build:
      context: .
      dockerfile: apps/email-worker/Dockerfile
    container_name: email-worker
    env_file: apps/email-worker/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-net
    restart: unless-stopped

  sms-worker:
    build:
      context: .
      dockerfile: apps/sms-worker/Dockerfile
    container_name: sms-worker
    env_file: apps/sms-worker/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-net
    restart: unless-stopped

  push-worker:
    build:
      context: .
      dockerfile: apps/push-worker/Dockerfile
    container_name: push-worker
    env_file: apps/push-worker/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-net
    restart: unless-stopped

  dlq-inspector:
    build:
      context: .
      dockerfile: apps/dlq-inspector/Dockerfile
    container_name: dlq-inspector
    env_file: apps/dlq-inspector/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-net
    restart: unless-stopped

networks:
  notification-net:
    driver: bridge

volumes:
  rabbitmq_data:

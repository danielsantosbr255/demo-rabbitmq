services:
  rabbitmq:
    image: rabbitmq:4.3-management-alpine
    container_name: rabbitmq
    hostname: rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-admin}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit collect_statistics_interval 1000 -rabbitmq_management sample_retention_policies [{global,[{10,1}]},{basic,[{10,1}]},{detailed,[{10,1}]}]"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    healthcheck:
      test: [ 'CMD', 'rabbitmq-diagnostics', 'ping' ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - notification-net

  mailpit:
    image: axllent/mailpit:latest
    container_name: mailpit
    ports:
      - '1025:1025'
      - '8025:8025'
    networks:
      - notification-net

  api-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
      target: prod
    image: api-gateway:prod
    pull_policy: build
    container_name: api-gateway
    ports:
      - '3000:3000'
    env_file: apps/api-gateway/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - notification-net
    restart: unless-stopped

  email-worker:
    build:
      context: ./apps/email-worker
      dockerfile: Dockerfile
    image: email-worker
    pull_policy: build
    container_name: email-worker
    env_file: apps/email-worker/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-net
    restart: unless-stopped

  sms-worker:
    build:
      context: ./apps/sms-worker
      dockerfile: Dockerfile
    image: sms-worker
    pull_policy: build
    container_name: sms-worker
    env_file: apps/sms-worker/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-net
    restart: unless-stopped

  monitor-api:
    build:
      context: ./apps/monitor-api
      dockerfile: Dockerfile
      target: prod
    image: monitor-api:prod
    pull_policy: build
    container_name: monitor-api
    ports:
      - '3001:3001'
    env_file: apps/monitor-api/.env
    environment:
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:5672
      RABBITMQ_API_URL: http://${RABBITMQ_USER:-admin}:${RABBITMQ_PASS:-admin}@rabbitmq:15672
    healthcheck:
      test: [ "CMD", "/nodejs/bin/node", "-e", "fetch('http://127.0.0.1:3001/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))" ]
      interval: 15s
      timeout: 5s
      retries: 5
    depends_on:
      rabbitmq:
        condition: service_healthy
    networks:
      - notification-net
    restart: unless-stopped

  dashboard:
    build:
      context: ./apps/dashboard
      dockerfile: Dockerfile
      args:
        VITE_API_GATEWAY_URL: "http://localhost:3000"
        VITE_INSPECTOR_URL: "http://localhost:3001"
    image: dashboard
    pull_policy: build
    container_name: dashboard
    ports:
      - '5173:8080'
    depends_on:
      rabbitmq:
        condition: service_healthy
      api-gateway:
        condition: service_healthy
      monitor-api:
        condition: service_healthy
    networks:
      - notification-net
    restart: unless-stopped

networks:
  notification-net:
    driver: bridge

volumes:
  rabbitmq_data:
